name: Build mGBA-LDN Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mGBA-LDN
        uses: actions/checkout@v4
        with:
          repository: Gr3nSkyDragon/mgba_LDN
          ref: mgba-ldn
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK / NDK
        shell: bash
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Locate Android Gradle project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root:"
          pwd

          echo "Android-related build files:"
          find . -type f \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
            -not -path "./.git/*" | sort

          WRAPPER="$(find . -type f -name gradlew -not -path './.git/*' | head -n 1 || true)"

          if [ -n "$WRAPPER" ]; then
            chmod +x "$WRAPPER"
            PROJECT_DIR="$(dirname "$WRAPPER")"
            echo "wrapper=$WRAPPER" >> "$GITHUB_OUTPUT"
            echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            echo "Using Gradle wrapper: $WRAPPER"
            exit 0
          fi

          BUILD_FILE="$(find . -type f \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path './.git/*' -print0 | \
            xargs -0 grep -Il "com.android.application" 2>/dev/null | head -n 1 || true)"

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::Could not locate an Android Gradle application project in mgba_LDN."
            find . -maxdepth 4 -type f | sort | head -n 1000
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "wrapper=" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using Android project: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          if [ -n "${{ steps.locate.outputs.wrapper }}" ]; then
            "${{ steps.locate.outputs.wrapper }}" assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Show generated APKs
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name "*.apk" -print | sort

      - name: Upload mGBA-LDN APK
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-LDN-Android-debug
          path: |
            **/build/outputs/apk/**/*.apk
          if-n
          o-files-found: error

name: Build mGBA-LDN Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout mGBA-LDN
        uses: actions/checkout@v4
        with:
          repository: Gr3nSkyDragon/mgba_LDN
          ref: mgba-ldn
          fetch-depth: 1
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.31.6" "ndk;27.2.12479018"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Inspect Android build layout
        shell: bash
        run: |
          set -euo pipefail
          echo "Gradle files:"
          find . -type f \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) -not -path "./.git/*" | sort
          echo "Android manifests:"
          find . -type f -name "AndroidManifest.xml" -not -path "./.git/*" | sort

      - name: Build Android application
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="$(find . -type f -name gradlew -not -path "./.git/*" | sort | head -n 1 || true)"
          if [ -n "$WRAPPER" ]; then
            PROJECT="$(dirname "$WRAPPER")"
            chmod +x "$WRAPPER"
            cd "$PROJECT"
            ./gradlew assembleDebug --stacktrace --no-daemon
            exit 0
          fi

          SETTINGS="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path "./.git/*" | sort | head -n 1 || true)"
          if [ -n "$SETTINGS" ]; then
            PROJECT="$(dirname "$SETTINGS")"
            cd "$PROJECT"
            gradle assembleDebug --stacktrace --no-daemon
            exit 0
          fi

          echo "::error::No Gradle Android project exists in the checked-out mgba_LDN branch."
          echo "No second/fake Android project will be generated."
          exit 1

      - name: List APK outputs
        if: success()
        shell: bash
        run: |
          find . -type f -name "*.apk" -not -path "./.git/*" | sort

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mgba-LDN-Android-debug
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files
          -found: error

      - name: Accept Android SDK licenses and install required SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: /tmp/gblink/GBLinkAndroidBridge
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GB-Link-Android-debug
          path: /tmp/gblink/GBLinkAndroidBridge/app/build/outputs/apk/debug/app-debug.apk
          

          mkdir -p /tmp/gblink
          unzip -q /tmp/project.zip -d /tmp/gblink

      - name: Accept Android SDK licenses and install required SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate embedded Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/gblink/GBLinkAndroidBridge/settings.gradle
          test -f /tmp/gblink/GBLinkAndroidBridge/app/build.gradle
          test -f /tmp/gblink/GBLinkAndroidBridge/app/src/main/java/io/gblink/androidbridge/MainActivity.java
          grep -q 'RFU-FRAME' /tmp/gblink/GBLinkAndroidBridge/app/src/main/java/io/gblink/androidbridge/MainActivity.java
          grep -q 'RFU-TX' /tmp/gblink/GBLinkAndroidBridge/app/src/main/java/io/gblink/androidbridge/MainActivity.java

      - name: Build debug APK
        working-directory: /tmp/gblink/GBLinkAndroidBridge
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GB-Link-Android-baudrate-signals-fix-debug
          path: /tmp/gblink/GBLinkAndroidBridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
